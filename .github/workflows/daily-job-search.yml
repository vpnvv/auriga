name: Auriga 4-Hour Job Search & Tracker Sync

on:
  schedule:
    # Runs every 4 hours at :30 past the hour (06:00, 10:00, 14:00, 18:00, 22:00, 02:00 IST)
    # In UTC: 00:30, 04:30, 08:30, 12:30, 16:30, 20:30
    - cron: '30 0,4,8,12,16,20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI or API anytime

jobs:
  run-search:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create Environment Secrets File
        run: |
          mkdir -p config
          cat << 'EOF' > config/.env
          APIFY_TOKEN=${{ secrets.APIFY_TOKEN }}
          GMAIL_USER=vipinvv555@gmail.com
          GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          CALLMEBOT_API_KEY=${{ secrets.CALLMEBOT_API_KEY }}
          EOF

      - name: Run Auriga Daily Search & Delivery
        run: |
          python3 scripts/run_daily_search.py --mode=send-approved

      - name: Commit & Push Updated Tracker
        if: always()
        run: |
          git config --global user.name "Auriga Bot"
          git config --global user.email "bot@auriga.local"
          mkdir -p public/data public/cvs
          cp tracker/job_tracker.json public/data/jobs.json || true
          cp job-search-output/*/cvs/*.pdf public/cvs/ 2>/dev/null || true
          git add tracker/ job-search-output/ public/data/jobs.json public/cvs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(tracker): update 4-hour search results [skip ci]" && git push)
